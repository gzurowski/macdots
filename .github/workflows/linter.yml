---
name: Lint Code Base

on: push

permissions:
  contents: read

jobs:
  build:
    name: Lint Code Base
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # 7.0.1
        with:
          fetch-depth: 0

      - name: Lint Code Base
        uses: github/super-linter/slim@2da136927bd4a73596db63044b504547c62cb854 # 9.0.0
        env:
          DEFAULT_BRANCH: main
          FILTER_REGEX_EXCLUDE: .*vscode/settings\.json
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VALIDATE_NATURAL_LANGUAGE: false
